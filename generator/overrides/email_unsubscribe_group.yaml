type: telnyx_email_unsubscribe_group
description: A group of email recipients can unsubscribe from, such as newsletters, without opting out of all mail.
create: POST /email_unsubscribe_groups
read: GET /email_unsubscribe_groups/{id}
update: PATCH /email_unsubscribe_groups/{id}
delete: DELETE /email_unsubscribe_groups/{id}
list: GET /email_unsubscribe_groups
attributes:
  name: {description: "The group's name."}
  description: {description: "What the group's mail is about."}
