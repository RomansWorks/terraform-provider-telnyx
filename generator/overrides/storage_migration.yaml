type: telnyx_storage_migration
description: A migration that copies a bucket from a migration source into Telnyx Storage. The API cannot delete migrations; stop one with the telnyx_storage_migration_stop action.
create: POST /storage/migrations
read: GET /storage/migrations/{id}
list: GET /storage/migrations
delete_warning: The Telnyx API cannot delete storage migrations. The migration was removed from Terraform state but still exists in your Telnyx account.
