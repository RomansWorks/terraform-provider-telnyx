type: telnyx_email_domain_webhook
description: A webhook that receives the events of an email domain, such as deliveries, bounces and verification changes.
create: POST /email_domains/{domain_id}/webhooks
read: GET /email_domains/{domain_id}/webhooks/{id}
update: PATCH /email_domains/{domain_id}/webhooks/{id}
delete: DELETE /email_domains/{domain_id}/webhooks/{id}
list: GET /email_domains/{domain_id}/webhooks
attributes:
  domain_id: {description: "The email domain the webhook belongs to."}
  events: {set: true}
