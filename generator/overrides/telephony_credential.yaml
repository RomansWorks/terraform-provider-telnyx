type: telnyx_telephony_credential
description: A credential that WebRTC clients use to sign in to a credential connection.
create: POST /telephony_credentials
read: GET /telephony_credentials/{id}
update: PATCH /telephony_credentials/{id}
delete: DELETE /telephony_credentials/{id}
list: GET /telephony_credentials
attributes:
  sip_password: {sensitive: true}
  token_material: {sensitive: true}
