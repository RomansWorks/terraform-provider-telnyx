type: telnyx_ai_assistant_canary_deploy
description: The canary deployment of an AI assistant, which routes matching conversations to other versions of the assistant. An assistant has at most one.
create: POST /ai/assistants/{assistant_id}/canary-deploys
read: GET /ai/assistants/{assistant_id}/canary-deploys
update: PUT /ai/assistants/{assistant_id}/canary-deploys
delete: DELETE /ai/assistants/{assistant_id}/canary-deploys
id_from_path: assistant_id
