type: telnyx_texml_secret
description: >-
  A TeXML secret: a named value that TeXML Mustache templates reference as a
  dynamic parameter, so the value never appears in the template or in logs.
  The Telnyx API can create or replace a secret but cannot read or delete it:
  Terraform cannot detect changes made outside it, the secret cannot be
  imported, and destroy leaves it in your account.
create: "POST /texml/secrets"
read: none
id: name
attributes:
  name: {force_new: true}
  value: {write_only: true}
