type: telnyx_whatsapp_phone_number_conversational_components
description: The conversational components of a WhatsApp phone number, the ice breakers and commands WhatsApp users see when they open a chat with the business. Creating this resource adopts the components of an existing number; destroying it leaves them as they are.
create: PATCH /whatsapp/phone_numbers/{phone_number}/conversational_components
read: GET /whatsapp/phone_numbers/{phone_number}/conversational_components
update: PATCH /whatsapp/phone_numbers/{phone_number}/conversational_components
id_from_path: phone_number
delete_warning: The Telnyx API cannot delete WhatsApp conversational components. They were removed from Terraform state but stay configured in your Telnyx account.
attributes:
  phone_number:
    description: The WhatsApp phone number in E.164 format.
  ice_breakers:
    description: Suggested opening messages a WhatsApp user can tap to start a chat, in display order.
  commands:
    description: Commands a WhatsApp user can send by typing `/`, in display order.
  commands[].command:
    description: The command, without the leading `/`.
  commands[].description:
    description: What the command does, shown to the WhatsApp user.
