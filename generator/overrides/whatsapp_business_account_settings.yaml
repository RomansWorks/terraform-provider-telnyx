type: telnyx_whatsapp_business_account_settings
description: "The settings of a WhatsApp Business Account (WABA): its name, timezone and the webhooks that receive its WhatsApp events. Creating this resource adopts the settings of an existing WABA; destroying it leaves them as they are."
create: PATCH /whatsapp/business_accounts/{id}/settings
read: GET /whatsapp/business_accounts/{id}/settings
update: PATCH /whatsapp/business_accounts/{id}/settings
id_from_path: id
path_params:
  id: whatsapp_business_account_id
delete_warning: The Telnyx API cannot delete WhatsApp Business Account settings. They were removed from Terraform state but keep their current values in your Telnyx account.
attributes:
  webhook_events:
    set: true
    description: The WhatsApp events sent to the webhook URLs.
  webhook_url:
    description: URL that receives the WhatsApp events of this account.
  webhook_failover_url:
    description: URL that receives the WhatsApp events of this account when webhook_url fails.
  webhook_enabled:
    description: Whether WhatsApp events are sent to the webhook URLs.
  name:
    description: Name of the WhatsApp Business Account.
