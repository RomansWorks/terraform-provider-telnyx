type: telnyx_enterprise_reputation
description: "Phone number reputation monitoring for an enterprise: enabled with a signed Letter of Authorization, refreshed at check_frequency. Destroy disables it."
create: POST /enterprises/{enterprise_id}/reputation
read: GET /enterprises/{enterprise_id}/reputation
delete: DELETE /enterprises/{enterprise_id}/reputation
id_from_path: enterprise_id
updates:
  - op: PATCH /enterprises/{enterprise_id}/reputation/frequency
  - op: PATCH /enterprises/{enterprise_id}/reputation/webhook
