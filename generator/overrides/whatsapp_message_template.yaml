type: telnyx_whatsapp_message_template
description: A WhatsApp message template of a WhatsApp Business Account. Templates are reviewed by Meta after create and after each change; status shows the outcome, and only approved templates can be used to start conversations.
create: POST /whatsapp/message_templates
read: GET /whatsapp/message_templates/{id}
update: PATCH /whatsapp/message_templates/{id}
delete: DELETE /whatsapp/message_templates/{id}
list: GET /whatsapp/message_templates
attributes:
  waba_id:
    # The read response carries the account as whatsapp_business_account.id;
    # a hook copies it here so import and drift detection see it.
    returned: true
