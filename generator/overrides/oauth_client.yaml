type: telnyx_oauth_client
description: "An OAuth 2.0 client that apps use to get access to the Telnyx API on behalf of users. A confidential client's secret is returned only when it is created and kept in state."
create: POST /oauth/clients
read: GET /oauth/clients/{id}
update: PUT /oauth/clients/{id}
delete: DELETE /oauth/clients/{id}
list: GET /oauth/clients
id: client_id
attributes:
  client_secret: {once: true}
  allowed_scopes: {set: true}
  allowed_grant_types: {set: true}
  redirect_uris: {set: true}
