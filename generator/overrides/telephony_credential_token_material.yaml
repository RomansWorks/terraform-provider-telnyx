type: telnyx_telephony_credential_token_material
kind: ephemeral
description: The key material a server needs to mint login tokens for a telephony credential itself, without asking Telnyx for each token. It is never stored in state.
open: "GET /telephony_credentials/{id}/token_material"
attributes:
  signing_secret: {sensitive: true}
  tel_token: {sensitive: true}
