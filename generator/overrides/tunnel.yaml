type: telnyx_tunnel
description: A tunnel that lets a telnyx-edge process on your own host connect to Telnyx. The tunnel token is returned only on create and kept in state as a sensitive value.
create: POST /tunnels
read: GET /tunnels/{id}
delete: DELETE /tunnels/{id}
list: GET /tunnels
attributes:
  tunnel_token: {create_only: true}
