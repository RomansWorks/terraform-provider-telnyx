type: telnyx_storage_cloudfs_filesystem
description: A CloudFS filesystem, a POSIX filesystem backed by Telnyx Storage.
create: POST /storage/cloudfs
read: GET /storage/cloudfs/{id}
update: PATCH /storage/cloudfs/{id}
delete: DELETE /storage/cloudfs/{id}
list: GET /storage/cloudfs
attributes:
  # Only the create response carries the token; rotate it with the
  # telnyx_storage_cloudfs_rotate_meta_token action.
  meta_token: {sensitive: true, from_create: true}
