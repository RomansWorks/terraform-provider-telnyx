type: telnyx_phone_number_bundle_status_change
kind: action
description: Assigns a phone number to a regulatory bundle, or removes it from its bundle when bundle_id is unset.
op: "PATCH /phone_numbers/{id}/actions/bundle_status_change"
attributes:
  bundle_id:
    nullable: true
    description: "The regulatory bundle to assign the number to. Leave unset to remove the number from its bundle. A number cannot move between bundles directly: remove it from its bundle first, then assign the new one."
