# POST /rcs/agents takes an Idempotency-Key header; the client adds it.
type: telnyx_rcs_agent
description: An RCS agent, the branded sender of RCS business messages, registered under an RCS brand. The API cannot delete agents, so destroy only removes the agent from Terraform state.
create: POST /rcs/agents
read: GET /rcs/agents/{id}
update: PATCH /rcs/agents/{id}
list: GET /rcs/agents
id: agent_id
delete_warning: The Telnyx API cannot delete RCS agents. The agent was removed from Terraform state but still exists in your Telnyx account.
attributes:
  agent_id: {description: Identifies the RCS agent.}
  brand_id: {description: The RCS brand the agent belongs to.}
  display_name: {description: The name shown to recipients as the sender.}
  use_case: {description: The kind of messages the agent sends.}
  hosting_region: {description: The region where the agent is hosted.}
  configuration: {description: The agent's registration details.}
  configuration.campaign: {description: The campaign details required to launch the agent.}
  configuration.testing: {description: Testing evidence required to launch the agent.}
  status: {description: The registration state of the agent.}
  basics_status: {description: The review status of the agent basics.}
  campaign_status: {description: The review status of the agent campaign.}
  billing_category: {description: The billing category assigned to the agent.}
  capabilities: {description: What the agent's registration path supports.}
  carrier_approvals: {description: The agent's approval by each carrier.}
  test_devices: {description: The test devices invited to the agent.}
  testing_status: {description: The status of the agent's testing.}
