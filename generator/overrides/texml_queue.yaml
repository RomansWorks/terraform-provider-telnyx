type: telnyx_texml_queue
description: A queue of TeXML calls in an account.
create: POST /texml/Accounts/{account_sid}/Queues
read: GET /texml/Accounts/{account_sid}/Queues/{queue_sid}
update: POST /texml/Accounts/{account_sid}/Queues/{queue_sid}
delete: DELETE /texml/Accounts/{account_sid}/Queues/{queue_sid}
id: sid
attributes:
  # Requests use the TeXML form names and responses snake_case; a read
  # hook copies max_size to MaxSize.
  max_size: {skip: true}
  MaxSize: {returned: true, computed: true}
