type: telnyx_messaging_profile_auto_response
description: An auto-response setting on a messaging profile, which answers inbound messages containing given keywords (opt-in, opt-out or help) with a fixed reply.
create: POST /messaging_profiles/{profile_id}/autoresp_configs
read: GET /messaging_profiles/{profile_id}/autoresp_configs/{autoresp_cfg_id}
update: PUT /messaging_profiles/{profile_id}/autoresp_configs/{autoresp_cfg_id}
delete: DELETE /messaging_profiles/{profile_id}/autoresp_configs/{autoresp_cfg_id}
list: GET /messaging_profiles/{profile_id}/autoresp_configs
path_params:
  profile_id: messaging_profile_id
attributes:
  op: {description: "The opt-in state the keywords trigger: `start` (opt in), `stop` (opt out) or `info` (help)."}
  keywords: {set: true, description: The keywords in an inbound message that trigger the response.}
  resp_text: {description: The text sent in reply.}
  country_code: {description: "The ISO 3166-1 alpha-2 country code of the senders this setting applies to, or `*` for all countries."}
  created_at: {description: ISO 8601 formatted date indicating when the resource was created.}
  updated_at: {description: ISO 8601 formatted date indicating when the resource was updated.}
