type: telnyx_traffic_policy_profile
description: A traffic policy profile that allows or blocks services, IP ranges and domains for SIM cards, with an optional bandwidth limit.
create: POST /traffic/policy/profiles
read: GET /traffic/policy/profiles/{id}
update: PATCH /traffic/policy/profiles/{id}
delete: DELETE /traffic/policy/profiles/{id}
list: GET /traffic/policy/profiles
attributes:
  services: {set: true}
  ip_ranges: {set: true}
  domains: {set: true}
