type: telnyx_calendar_connection
description: Policy and defaults for a meeting bot calendar connection (Google Calendar or Microsoft Outlook), applied to sessions created for future meetings. A connection is created by completing calendar OAuth in a browser, so create adopts a connection that already exists. Destroy only removes it from Terraform state unless `release_on_destroy` is true, in which case it disconnects the calendar.
create: PATCH /calendar_connections/{id}
read: GET /calendar_connections/{id}
update: PATCH /calendar_connections/{id}
delete: DELETE /calendar_connections/{id}
list: GET /calendar_connections
id_from_path: id
path_params:
  id: calendar_connection_id
release_on_destroy: true
delete_warning: The calendar connection was removed from Terraform state but is still connected in Telnyx. Set release_on_destroy = true to disconnect it on destroy.
