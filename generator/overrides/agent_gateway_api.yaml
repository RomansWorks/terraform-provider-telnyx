type: telnyx_agent_gateway_api
description: An API whose OpenAPI operations an Agent Gateway exposes as tools.
create: "POST /agent_gateways/{instance_id}/apis"
update: "PATCH /agent_gateways/{instance_id}/apis/{api_id}"
delete: "DELETE /agent_gateways/{instance_id}/apis/{api_id}"
list: "GET /agent_gateways/{instance_id}/apis"
read_from: {op: "GET /agent_gateways/{instance_id}/apis", key: id}
path_params:
  instance_id: gateway_id
  api_id: id
attributes:
  # Responses show the method's type only, never its credentials.
  auth: {write_only: true}
  static_headers: {sensitive: true}
  tools: {set: true}
  forwarded_headers: {set: true}
