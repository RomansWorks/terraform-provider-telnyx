type: telnyx_compute_function_log_export
description: Where a compute function's logs are exported to.
create: PUT /compute/funcs/{id}/logs/export
read: GET /compute/funcs/{id}/logs/export
update: PUT /compute/funcs/{id}/logs/export
delete: DELETE /compute/funcs/{id}/logs/export
id_from_path: id
path_params:
  id: function_id
attributes:
  # Headers sent to the endpoint usually carry credentials; the API does
  # not return them.
  headers: {sensitive: true}
