type: telnyx_10dlc_shared_campaign
description: >-
  A partner 10DLC campaign that another campaign service provider shared with Telnyx and Telnyx
  accepted. Terraform manages only its webhook URLs; the campaign itself is owned by the partner.
create: PATCH /10dlc/partner_campaigns/{campaignId}
read: GET /10dlc/partner_campaigns/{campaignId}
update: PATCH /10dlc/partner_campaigns/{campaignId}
id_from_path: campaignId
delete_warning: >-
  A shared campaign is owned by the partner that shared it and cannot be deleted through Telnyx.
  It was removed from Terraform state; its webhook URLs keep their last values.
attributes:
  webhookURL: {name: webhook_url}
  webhookFailoverURL: {name: webhook_failover_url}
  subUsecases: {set: true}
