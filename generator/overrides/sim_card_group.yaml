type: telnyx_sim_card_group
description: A group of SIM cards that share a data limit, a private wireless gateway and a wireless blocklist.
create: POST /sim_card_groups
read: GET /sim_card_groups/{id}
update: PATCH /sim_card_groups/{id}
delete: DELETE /sim_card_groups/{id}
list: GET /sim_card_groups
updates:
  - op: POST /sim_card_groups/{id}/actions/set_private_wireless_gateway
    clear: POST /sim_card_groups/{id}/actions/remove_private_wireless_gateway
  - op: POST /sim_card_groups/{id}/actions/set_wireless_blocklist
    clear: POST /sim_card_groups/{id}/actions/remove_wireless_blocklist
