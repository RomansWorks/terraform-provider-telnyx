type: telnyx_agent_gateway_team
description: "A team on an Agent Gateway: a model list, a budget and rate limits that its keys share."
create: "POST /agent_gateways/{instance_id}/teams"
update: "PATCH /agent_gateways/{instance_id}/teams/{team_id}"
delete: "DELETE /agent_gateways/{instance_id}/teams/{team_id}"
list: "GET /agent_gateways/{instance_id}/teams"
read_from: {op: "GET /agent_gateways/{instance_id}/teams", key: id}
path_params:
  instance_id: gateway_id
  team_id: id
attributes:
  models: {set: true}
