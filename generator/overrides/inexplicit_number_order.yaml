type: telnyx_inexplicit_number_order
description: An order for phone numbers by criteria, such as a quantity in an area, instead of specific numbers. Orders cannot be cancelled through the API.
create: POST /inexplicit_number_orders
read: GET /inexplicit_number_orders/{id}
list: GET /inexplicit_number_orders
attributes:
  # Sent as a string, returned as a number; a hook turns it back into a
  # string so import and drift detection see it.
  ordering_groups[].count_requested: {returned: true}
