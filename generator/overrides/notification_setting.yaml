type: telnyx_notification_setting
description: A notification setting, which sends a notification through a channel of a notification profile when a notification event condition is met. The API cannot change it, so every change replaces it.
create: POST /notification_settings
read: GET /notification_settings/{id}
delete: DELETE /notification_settings/{id}
list: GET /notification_settings
attributes:
  id: {description: Identifies the notification setting.}
  parameters: {description: "The parameters of the event condition, such as a threshold."}
  parameters[].name: {description: The parameter name.}
  parameters[].value: {description: The parameter value.}
  associated_record_type: {description: The type of record the setting applies to.}
  associated_record_type_value: {description: The record the setting applies to.}
