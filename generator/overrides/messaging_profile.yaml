type: telnyx_messaging_profile
description: A messaging profile, which groups the settings for sending and receiving SMS and MMS (webhooks, allowed destinations, number pool, spend limits) shared by the numbers assigned to it.
create: POST /messaging_profiles
read: GET /messaging_profiles/{id}
update: PATCH /messaging_profiles/{id}
delete: DELETE /messaging_profiles/{id}
list: GET /messaging_profiles
attributes:
  id: {description: Identifies the messaging profile.}
  whitelisted_destinations: {set: true}
  v1_secret: {sensitive: true}
