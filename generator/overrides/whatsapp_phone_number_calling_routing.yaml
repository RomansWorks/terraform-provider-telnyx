type: telnyx_whatsapp_phone_number_calling_routing
description: The connection that receives inbound WhatsApp calls to a WhatsApp Calling BYON (bring your own number) phone number. Creating this resource adopts the routing of an existing number; destroying it leaves the routing as it is.
create: PATCH /whatsapp/phone_numbers/{id}/calling_routing
read: GET /whatsapp/phone_numbers/{id}/calling_routing
update: PATCH /whatsapp/phone_numbers/{id}/calling_routing
id_from_path: id
path_params:
  id: phone_number
delete_warning: The Telnyx API cannot delete WhatsApp calling routing. It was removed from Terraform state but stays in place in your Telnyx account.
attributes:
  phone_number:
    description: The BYON phone number in E.164 format, with the leading `+`.
  connection_id:
    description: ID of the connection that inbound WhatsApp calls to the number are delivered to.
