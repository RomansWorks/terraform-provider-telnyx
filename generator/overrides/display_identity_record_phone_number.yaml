type: telnyx_display_identity_record_phone_number
description: "A phone number that shows a DIR's branded identity when it calls. Telnyx vets the number; status says how far."
create: POST /dir/{dir_id}/phone_numbers
delete: DELETE /dir/{dir_id}/phone_numbers
list: GET /dir/{dir_id}/phone_numbers
read_from: {op: "GET /dir/{dir_id}/phone_numbers", key: id}
attributes:
  phone_numbers: {skip: true} # the create hook sends phone_number as a list of one
  phone_number: {required: true, force_new: true, description: "The phone number to show the display identity for, in E.164 format with a leading `+`."}
