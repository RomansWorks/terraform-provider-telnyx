type: telnyx_email_inbox_sender_filters
description: >-
  The sender allowlist and blocklist of an email inbox. Terraform manages both lists as a whole.
  The Telnyx API cannot delete them: destroy removes them from Terraform state and leaves them on the inbox.
create: PUT /email_inboxes/{inbox_id}/filters
read: GET /email_inboxes/{inbox_id}/filters
update: PUT /email_inboxes/{inbox_id}/filters
id_from_path: inbox_id
attributes:
  allowlist: {set: true}
  blocklist: {set: true}
