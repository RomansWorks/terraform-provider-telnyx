type: telnyx_messaging_hosted_number_order_verification_codes
kind: action
description: Sends verification codes by call or SMS to numbers in a messaging hosted number order. Submit the codes with telnyx_messaging_hosted_number_order_validation_codes.
op: "POST /messaging_hosted_number_orders/{id}/verification_codes"
path_params:
  id: messaging_hosted_number_order_id
attributes:
  phone_numbers: {description: The +E.164 phone numbers of the order to send codes to.}
  verification_method: {description: "How the codes are delivered: by phone call or SMS."}
