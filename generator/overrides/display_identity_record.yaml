type: telnyx_display_identity_record
description: "A Display Identity Record (DIR) for Branded Calling: the name, logo and call reasons shown to the people an enterprise calls. Edit it while it is a draft, then submit it with the telnyx_display_identity_record_submit action."
create: POST /enterprises/{enterprise_id}/dir
read: GET /dir/{dir_id}
update: PATCH /dir/{dir_id}
delete: DELETE /dir/{dir_id}
list: GET /dir
