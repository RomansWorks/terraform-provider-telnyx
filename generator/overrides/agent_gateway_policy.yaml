type: telnyx_agent_gateway_policy
description: A named set of guardrails on an Agent Gateway, applied to requests by policy attachments.
create: "POST /agent_gateways/{instance_id}/policies"
read: "GET /agent_gateways/{instance_id}/policies/{name}"
update: "PATCH /agent_gateways/{instance_id}/policies/{name}"
delete: "DELETE /agent_gateways/{instance_id}/policies/{name}"
list: "GET /agent_gateways/{instance_id}/policies"
id: name
path_params:
  instance_id: gateway_id
