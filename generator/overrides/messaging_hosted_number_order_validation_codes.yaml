type: telnyx_messaging_hosted_number_order_validation_codes
kind: action
description: Submits the verification codes received by call or SMS on the numbers of a messaging hosted number order, proving that you control them.
op: "POST /messaging_hosted_number_orders/{id}/validation_codes"
path_params:
  id: messaging_hosted_number_order_id
attributes:
  verification_codes: {description: The code received on each phone number.}
  verification_codes[].phone_number: {description: The +E.164 phone number the code was sent to.}
  verification_codes[].code: {description: The verification code received on the number.}
