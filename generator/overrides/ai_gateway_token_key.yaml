type: telnyx_ai_gateway_token_key
description: A token key of the AI gateway, which applications call LLMs with under the limits of its token group.
create: POST /llm_token_gateway/token_keys
read: GET /llm_token_gateway/token_keys/{id}
update: PATCH /llm_token_gateway/token_keys/{id}
delete: DELETE /llm_token_gateway/token_keys/{id}
list: GET /llm_token_gateway/token_keys
attributes:
  allowed_models: {set: true}
  # The key is shown once, in the create response.
  token: {sensitive: true, create_only: true}
