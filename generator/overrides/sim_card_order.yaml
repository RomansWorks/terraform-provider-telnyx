type: telnyx_sim_card_order
description: "An order for physical SIM cards shipped to an address. Orders cannot be cancelled: destroy removes the order from state."
create: POST /sim_card_orders
read: GET /sim_card_orders/{id}
list: GET /sim_card_orders
attributes:
  # The response holds the address in order_address; a read hook copies
  # its id to address_id.
  address_id: {returned: true}
