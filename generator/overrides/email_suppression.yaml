type: telnyx_email_suppression
description: >-
  A manual block that stops email to a recipient, for the whole account or, with `domain_id`
  or `from`, for one domain or sender. Telnyx also adds suppressions for bounces, complaints
  and unsubscribes; read them with `telnyx_email_suppressions`.
create: POST /email_blocks
read: GET /email_blocks/{id}
delete: DELETE /email_blocks/{id}
list: GET /email_blocks
attributes:
  to: {description: "The recipient address to block."}
  from: {description: "Blocks only mail from this sender address. Not set blocks mail from any sender."}
  domain_id: {description: "Blocks only mail from this email domain. Not set blocks mail from the whole account."}
