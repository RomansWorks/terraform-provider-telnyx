type: telnyx_rcs_agent_test_device
description: A test device invited to an RCS agent, which can receive the agent's messages before launch.
create: POST /rcs/agents/{id}/test_devices
delete: DELETE /rcs/agents/{id}/test_devices/{test_device_id}
list: GET /rcs/agents/{id}/test_devices
read_from: {op: "GET /rcs/agents/{id}/test_devices", key: test_device_id}
id: test_device_id
path_params:
  id: agent_id
attributes:
  phone_number: {description: The +E.164 phone number of the test device.}
  invite_status: {description: The status of the invitation to the device.}
