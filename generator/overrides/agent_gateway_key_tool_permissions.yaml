type: telnyx_agent_gateway_key_tool_permissions
description: The MCP servers and APIs, and their tools, that an Agent Gateway key may call. Each apply replaces the whole grant; destroy grants none.
create: "PUT /agent_gateways/{instance_id}/keys/{key_id}/tool_permissions"
read: "GET /agent_gateways/{instance_id}/keys/{key_id}/tool_permissions"
update: "PUT /agent_gateways/{instance_id}/keys/{key_id}/tool_permissions"
id_from_path: key_id
path_params:
  instance_id: gateway_id
attributes:
  servers: {set: true}
