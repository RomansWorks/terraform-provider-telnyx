type: telnyx_porting_order_additional_document
description: A document attached to a porting order in addition to its LOA and invoice.
create: POST /porting_orders/{id}/additional_documents
delete: DELETE /porting_orders/{id}/additional_documents/{additional_document_id}
list: GET /porting_orders/{id}/additional_documents
read_from: {op: "GET /porting_orders/{id}/additional_documents", key: id}
path_params:
  id: porting_order_id
attributes:
  additional_documents:
    skip: true # the create hook sends this document as a list of one
  document_id: {required: true, force_new: true, description: The id of the uploaded document.}
  document_type: {required: true, force_new: true, description: "The type of document: loa, invoice, csr or other."}
