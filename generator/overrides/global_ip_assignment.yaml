type: telnyx_global_ip_assignment
description: Assigns a Global IP to a WireGuard peer, so traffic to the address goes over that peer's tunnel. Assignment completes in the background.
create: POST /global_ip_assignments
read: GET /global_ip_assignments/{id}
update: PATCH /global_ip_assignments/{id}
delete: DELETE /global_ip_assignments/{id}
list: GET /global_ip_assignments
