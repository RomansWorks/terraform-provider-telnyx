type: telnyx_whatsapp_phone_number_calling_settings
description: Whether WhatsApp calling is enabled for a WhatsApp phone number. Creating this resource adopts the setting of an existing number; destroying it leaves the setting as it is.
create: PATCH /whatsapp/phone_numbers/{phone_number}/calling_settings
read: GET /whatsapp/phone_numbers/{phone_number}/calling_settings
update: PATCH /whatsapp/phone_numbers/{phone_number}/calling_settings
id_from_path: phone_number
delete_warning: The Telnyx API cannot delete WhatsApp calling settings. They were removed from Terraform state but keep their current values in your Telnyx account.
attributes:
  phone_number:
    description: The WhatsApp phone number in E.164 format.
  enabled:
    description: Whether WhatsApp calling is enabled for the phone number.
