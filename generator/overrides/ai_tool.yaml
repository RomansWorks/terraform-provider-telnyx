type: telnyx_ai_tool
description: A shared tool that AI assistants can use, such as a webhook, a handoff or a retrieval.
create: POST /ai/tools
read: GET /ai/tools/{tool_id}
update: PATCH /ai/tools/{tool_id}
delete: DELETE /ai/tools/{tool_id}
# The API returns the variant's settings as tool_definition; the after-read
# hook copies them back to the attribute named by type.
attributes:
  function: {returned: true}
  retrieval: {returned: true}
  handoff: {returned: true}
  invite: {returned: true}
  webhook: {returned: true}
  pay: {returned: true}
  client_side_tool: {returned: true}
  update_dynamic_variables: {returned: true}
  vision: {returned: true}
