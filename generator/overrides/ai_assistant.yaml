type: telnyx_ai_assistant
description: An AI assistant that handles voice calls, messages and web chats.
create: POST /ai/assistants
read: GET /ai/assistants/{assistant_id}
update: POST /ai/assistants/{assistant_id}
delete: DELETE /ai/assistants/{assistant_id}
attributes:
  tags: {set: true}
  conversation_flow:
    json: true # a graph of nodes and edges, clearer as one JSON document
  promote_to_main:
    skip: true # a per-request action, not a setting
