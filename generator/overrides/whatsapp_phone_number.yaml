type: telnyx_whatsapp_phone_number
description: A phone number registered for WhatsApp with a WhatsApp Business Account. Creating it starts registration and sends a verification code to the number by SMS or voice call; complete registration with the telnyx_whatsapp_phone_number_verify action (telnyx_whatsapp_phone_number_resend_verification sends a new code). Destroying it removes the number's WhatsApp registration.
create: POST /whatsapp/business_accounts/{id}/phone_numbers
read: GET /whatsapp/phone_numbers/{phone_number}
delete: DELETE /whatsapp/phone_numbers/{phone_number}
list: GET /whatsapp/phone_numbers
id: phone_number
path_params:
  id: whatsapp_business_account_id
attributes:
  phone_number:
    description: The phone number to register, in E.164 format. It identifies the number in the other WhatsApp resources.
  display_name:
    description: The business name shown to WhatsApp users. Meta reviews it during registration.
  language:
    description: Language of the verification message, such as en_US. Defaults to en_US.
  verification_method:
    description: How the verification code is delivered, sms or voice. Defaults to sms.
  status:
    description: WhatsApp registration status of the number.
  calling_enabled:
    description: Whether WhatsApp calling is enabled for the number.
