type: telnyx_whatsapp_phone_number_profile
description: The WhatsApp business profile of a phone number, the description, address, website and contact details WhatsApp users see. Creating this resource adopts the profile of an existing number; destroying it leaves the profile as it is.
create: PATCH /whatsapp/phone_numbers/{phone_number}/profile
read: GET /whatsapp/phone_numbers/{phone_number}/profile
update: PATCH /whatsapp/phone_numbers/{phone_number}/profile
id_from_path: phone_number
delete_warning: The Telnyx API cannot delete a WhatsApp business profile. It was removed from Terraform state but keeps its current values in your Telnyx account.
attributes:
  about:
    description: The business's About text, at most 139 characters.
  address:
    description: The business's address.
  category:
    description: The business category (vertical) shown on the profile.
  description:
    description: Description of the business, at most 512 characters.
  display_name:
    description: The business name shown on the profile.
  email:
    description: The business's contact email address.
  website:
    description: The business's website URL.
  profile_photo_url:
    description: URL of the profile photo. Set the photo with the telnyx_whatsapp_phone_number_profile_photo_upload action.
