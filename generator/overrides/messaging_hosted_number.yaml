type: telnyx_messaging_hosted_number
description: A number hosted on Telnyx for messaging only, once its hosted number order has completed. Create adopts the existing hosted number and manages its settings. Destroy keeps it unless release_on_destroy is true.
create: PATCH /messaging_hosted_numbers/{id}
read: GET /messaging_hosted_numbers/{id}
update: PATCH /messaging_hosted_numbers/{id}
delete: DELETE /messaging_hosted_numbers/{id}
list: GET /messaging/hosted/numbers
id_from_path: id
path_params:
  id: messaging_hosted_number_id
release_on_destroy: true
attributes:
  id: {description: Identifies the hosted number.}
  tags: {set: true}
