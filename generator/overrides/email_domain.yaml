type: telnyx_email_domain
description: >-
  A domain for sending email and, optionally, receiving it. The DNS records to publish are in
  `dns_records` and in the `telnyx_email_domain_dns_records` data source; verify them with the
  `telnyx_email_domain_verify` action.
create: POST /email_domains
read: GET /email_domains/{id}
update: PATCH /email_domains/{id}
delete: DELETE /email_domains/{id}
list: GET /email_domains
force_destroy: [force]
attributes:
  domain: {description: "The domain name, such as `mail.example.com`."}
  inbound_enabled: {returned: true, computed: true, description: "Whether the domain receives email for its inboxes."}
