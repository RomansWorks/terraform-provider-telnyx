# Checks the upstream Telnyx OpenAPI spec daily. When Telnyx has published a
# new commit, opens (or refreshes) one pull request with the new pin, the
# regenerated catalog, the output of `make generate` (descriptors, docs and
# examples, so the Generated docs check passes) and the API diff report. A coding agent then turns that
# pull request into an OpenSpec sync change (see AGENTS.md).
name: Telnyx API sync

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: telnyx-api-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Fetch upstream spec
        id: fetch
        run: make upstream-fetch
      - name: Rebuild catalog and diff report
        if: steps.fetch.outputs.changed == 'true'
        run: |
          make catalog
          make api-diff BASE=HEAD
      # make generate formats examples with the Terraform CLI.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.fetch.outputs.changed == 'true'
        with:
          terraform_wrapper: false
      # Fails when an override names an operation the new spec removed. The
      # pull request still opens; the sync change fixes the override.
      - name: Regenerate descriptors and docs
        id: generate
        if: steps.fetch.outputs.changed == 'true'
        continue-on-error: true
        run: make generate
      - name: Write pull request body
        if: steps.fetch.outputs.changed == 'true'
        run: |
          {
            echo "Telnyx published a new API spec: \`${OLD:0:7}\` → \`${NEW:0:7}\`."
            echo
            echo "Next step: ask the coding agent to **run the Telnyx sync** on this branch."
            echo "It creates an OpenSpec change from this report and implements it."
            echo
            if [ "$GENERATE" != "success" ]; then
              echo "> [!WARNING]"
              echo "> \`make generate\` failed, so this pull request has only the pin and catalog."
              echo "> An override probably uses an operation this spec removed: fix it in the sync change."
              echo
            fi
            # GitHub limits a pull request body to 65,536 characters.
            head -c 60000 build/api-diff.md
          } > build/pr-body.md
        env:
          OLD: ${{ steps.fetch.outputs.old_commit }}
          NEW: ${{ steps.fetch.outputs.new_commit }}
          GENERATE: ${{ steps.generate.outcome }}
      - name: Open or update pull request
        if: steps.fetch.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          # A token other than GITHUB_TOKEN is needed for the pull request to
          # trigger the Tests workflow. Falls back to GITHUB_TOKEN if unset.
          token: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          branch: sync/telnyx-api
          delete-branch: true
          commit-message: 'sync: pin Telnyx API spec to ${{ steps.fetch.outputs.new_commit }}'
          title: 'Sync Telnyx API spec to ${{ steps.fetch.outputs.new_commit }}'
          body-path: build/pr-body.md
          labels: api-sync
          add-paths: |
            upstream/**
            catalog/**
            internal/provider/generated/**
            docs/**
            examples/**
