type: telnyx_short_code_settings
description: The messaging settings of a short code in your account. Create adopts the short code and assigns it to a messaging profile. Short codes cannot be deleted through the API, so destroy only removes the settings from Terraform state.
create: PATCH /short_codes/{id}
read: GET /short_codes/{id}
update: PATCH /short_codes/{id}
list: GET /short_codes
id_from_path: id
list_name: telnyx_short_codes
path_params:
  id: short_code_id
delete_warning: The Telnyx API cannot delete short codes. The settings were removed from Terraform state, and the short code keeps them in your Telnyx account.
attributes:
  id: {description: Identifies the short code.}
  tags: {set: true}
