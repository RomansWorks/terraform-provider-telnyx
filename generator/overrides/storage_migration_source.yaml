type: telnyx_storage_migration_source
description: A bucket in another cloud that storage migrations copy from, with the credentials to read it.
create: POST /storage/migration_sources
read: GET /storage/migration_sources/{id}
delete: DELETE /storage/migration_sources/{id}
list: GET /storage/migration_sources
attributes:
  provider: {name: source_provider}
  provider_auth: {sensitive: true}
