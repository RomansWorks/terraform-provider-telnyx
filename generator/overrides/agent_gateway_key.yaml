type: telnyx_agent_gateway_key
description: A virtual key that applications call an Agent Gateway with, under its own models, budget and rate limits.
create: "POST /agent_gateways/{instance_id}/keys"
update: "PATCH /agent_gateways/{instance_id}/keys/{key_id}"
delete: "DELETE /agent_gateways/{instance_id}/keys/{key_id}"
list: "GET /agent_gateways/{instance_id}/keys"
read_from: {op: "GET /agent_gateways/{instance_id}/keys", key: id}
path_params:
  instance_id: gateway_id
  key_id: id
attributes:
  models: {set: true}
  # The key's value is shown once, in the create response.
  key:
    sensitive: true
    create_only: true
    description: "The key's value, sent to the gateway as `Authorization: Bearer <key>`. The API returns it only when the key is created, so it is kept in state and is null after import."
