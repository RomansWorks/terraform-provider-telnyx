type: telnyx_storage_object_presigned_url
kind: ephemeral
description: >-
  A presigned URL that grants temporary access to one object in a Telnyx
  Cloud Storage bucket without credentials. It is never stored in plan or state.
open: "POST /storage/buckets/{bucketName}/{objectName}/presigned_url"
path_params:
  bucketName: bucket_name
  objectName: object_name
attributes:
  content: {description: The presigned URL and when it expires.}
