schema: spec-driven

context: |
  This repository is terraform-provider-telnyx, a community Terraform and OpenTofu
  provider for the Telnyx API v2, published as RomansWorks/telnyx.
  Go, Terraform Plugin Framework (protocol 6). SDKv2 is not used.
  The Telnyx API contract is upstream/telnyx/spec3.json, pinned by
  upstream/telnyx/lock.json. It is generated by Telnyx and must never be edited
  by hand. Agents read upstream/telnyx/by-tag/<tag>.json and catalog/*.yaml
  instead of the full 8 MB spec.
  catalog/coverage.yaml classifies every API operation (resource, data_source,
  action, ephemeral, out_of_scope). "All resources present" means every operation
  is classified and every resource or data source entry is implemented and tested.
  The provider calls the API through internal/client, not the telnyx-go SDK.
  Runtime traffic (calls, message sends, chats) and reports are out of scope.
  Product-area specs live under openspec/specs/<area>/ (ai-assistants, numbers,
  messaging, voice, wireless, networking, storage, email, account, ...). Cross-cutting
  specs are provider-core, api-sync, release and codegen.
  Upstream API syncs use the telnyx-sync schema: `--schema telnyx-sync`.

rules:
  proposal:
    - State which upstream commit range or Telnyx product area the change covers.
    - Mark any change to an existing resource's schema, import id or behaviour that can break a user's configuration or state as **BREAKING**.
  specs:
    - Name Terraform types telnyx_<noun> in snake_case, using the names Telnyx shows in its portal where they differ from path names.
    - Give every resource requirement scenarios for create, read after apply (empty plan), update in place or replace, delete, and import.
    - State which attributes are required, optional, computed or sensitive, and which force replacement.
    - When the API cannot delete an object, specify that destroy removes it from state and warns.
  design:
    - Say whether the resource is generated, generated with overrides, or hand-written, and why.
  tasks:
    - Each resource task includes unit tests against recorded responses, an acceptance test with an import step, an example under examples/, and a changie entry.
    - End with `make check` passing.

operations:
  apply:
    guidance:
      - Run `make generate` after editing overrides, and never edit files marked as generated.
      - Update catalog/coverage.yaml entries you implement or classify, and set reviewed to true.
  archive:
    guidance:
      - Confirm `make check` passes before archiving.
