type: telnyx_notification_channel
description: A notification channel, which delivers the notifications of a notification profile by email, SMS, voice call or webhook to one destination.
create: POST /notification_channels
read: GET /notification_channels/{id}
update: PATCH /notification_channels/{id}
delete: DELETE /notification_channels/{id}
list: GET /notification_channels
attributes:
  id: {description: Identifies the notification channel.}
  channel_type_id: {description: "How notifications are delivered: `email`, `sms`, `voice` or `webhook`."}
  channel_destination: {description: "Where notifications are delivered: an email address, a +E.164 phone number or a webhook URL, depending on `channel_type_id`."}
