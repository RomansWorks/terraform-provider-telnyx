type: telnyx_ai_collection_source
description: A source that fills an AI knowledge collection, such as a storage bucket or the account's calls.
create: POST /ai/collections/{uuid}/sources
delete: DELETE /ai/collections/{uuid}/sources/{sourceId}
list: GET /ai/collections/{uuid}/sources
read_from: {op: "GET /ai/collections/{uuid}/sources", key: id}
path_params:
  uuid: collection_id
  sourceId: id
