type: telnyx_email_ip_pool_ip
description: >-
  A dedicated IP's membership of an IP pool. An IP is in at most one pool; destroy takes it
  out of the pool and keeps the IP.
create: POST /email/ip_pools/{id}/ips
delete: DELETE /email/ip_pools/{id}/ips/{ip_id}
read_from: {op: "GET /email/ip_pools/{id}", field: ips, key: id}
id: dedicated_ip_id
path_params:
  id: pool_id
force_destroy: [force, drain]
attributes:
  pool_id: {description: "The IP pool."}
