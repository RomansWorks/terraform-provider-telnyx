type: telnyx_tailscale_subnet_router
description: A Tailscale subnet router on a network that advertises the network's routes to your tailnet. Create enrolls it with a Tailscale auth key.
create: POST /tailscale_subnet_routers
read: GET /tailscale_subnet_routers/{id}
update: PATCH /tailscale_subnet_routers/{id}
delete: DELETE /tailscale_subnet_routers/{id}
list: GET /tailscale_subnet_routers
attributes:
  auth_key: {write_only: true}
  advertised_routes: {set: true}
