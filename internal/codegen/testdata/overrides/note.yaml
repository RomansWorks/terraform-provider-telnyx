type: telnyx_folder_note
description: A note in a folder.
create: POST /folders/{folder_id}/notes
read: GET /folders/{folder_id}/notes/{note_id}
update: PUT /folders/{folder_id}/notes/{note_id}
data_source: false
attributes:
  count:
    name: note_count
add:
  - name: source_file
    kind: string
    optional: true
    description: A local file the note was read from.
