type: telnyx_agent_gateway_mcp_server
description: An MCP server whose tools an Agent Gateway exposes to its keys.
create: "POST /agent_gateways/{instance_id}/mcp_servers"
update: "PATCH /agent_gateways/{instance_id}/mcp_servers/{server_id}"
delete: "DELETE /agent_gateways/{instance_id}/mcp_servers/{server_id}"
list: "GET /agent_gateways/{instance_id}/mcp_servers"
read_from: {op: "GET /agent_gateways/{instance_id}/mcp_servers", key: id}
path_params:
  instance_id: gateway_id
  server_id: id
attributes:
  # Responses show the method's type only, never its credentials.
  auth: {write_only: true}
  static_headers: {sensitive: true}
  tools: {set: true}
  forwarded_headers: {set: true}
