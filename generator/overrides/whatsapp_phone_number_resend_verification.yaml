type: telnyx_whatsapp_phone_number_resend_verification
kind: action
description: "Sends a new verification code to a phone number whose WhatsApp registration was started with telnyx_whatsapp_phone_number. Submit the code with the telnyx_whatsapp_phone_number_verify action."
op: "POST /whatsapp/phone_numbers/{phone_number}/resend_verification"
attributes:
  verification_method:
    description: How the verification code is delivered, sms or voice. Defaults to sms.
