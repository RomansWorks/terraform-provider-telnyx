type: telnyx_email_unsubscribe_group_suppression
description: A recipient unsubscribed from one unsubscribe group, identified by its email address.
create: POST /email_unsubscribe_groups/{id}/suppressions
delete: DELETE /email_unsubscribe_groups/{id}/suppressions/{email}
list: GET /email_unsubscribe_groups/{id}/suppressions
read_from: {op: "GET /email_unsubscribe_groups/{id}/suppressions", key: to}
id: to
path_params:
  id: group_id
attributes:
  group_id: {description: "The unsubscribe group."}
  to: {description: "The recipient's email address."}
