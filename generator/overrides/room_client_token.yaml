type: telnyx_room_client_token
kind: ephemeral
description: >-
  A client token that lets a participant join a video room, with the refresh
  token that renews it. Neither is ever stored in plan or state.
open: "POST /rooms/{room_id}/actions/generate_join_client_token"
attributes:
  token: {description: The client token a participant joins the room with.}
  refresh_token: {description: "The refresh token that renews the client token with `POST /rooms/{room_id}/actions/refresh_client_token`."}
