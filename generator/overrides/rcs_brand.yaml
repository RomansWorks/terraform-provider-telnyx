type: telnyx_rcs_brand
description: An RCS brand, the verified business under which RCS agents are registered. The API cannot delete brands, so destroy only removes the brand from Terraform state.
create: POST /rcs/brands
read: GET /rcs/brands/{id}
update: PATCH /rcs/brands/{id}
list: GET /rcs/brands
id: brand_id
delete_warning: The Telnyx API cannot delete RCS brands. The brand was removed from Terraform state but still exists in your Telnyx account.
attributes:
  brand_id: {description: Identifies the RCS brand.}
  display_name: {description: The brand name shown to recipients.}
  legal_name: {description: The legal name of the business.}
  legal_entity_type: {description: The legal form of the business.}
  organization_type: {description: The kind of organization.}
  website_url: {description: The business website.}
  addresses: {description: The business addresses.}
  status: {description: The verification state of the brand.}
  capabilities: {description: What the brand's registration path supports.}
