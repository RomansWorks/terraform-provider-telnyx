type: telnyx_whatsapp_user_data
description: The account-wide WhatsApp settings of your Telnyx account, the webhook URLs that receive WhatsApp signup events. There is one per account; creating this resource adopts it and destroying it leaves its values as they are.
create: PATCH /v2/whatsapp/user_data
read: GET /v2/whatsapp/user_data
update: PATCH /v2/whatsapp/user_data
singleton: true
delete_warning: The Telnyx API cannot delete WhatsApp user data. It was removed from Terraform state but keeps its current values in your Telnyx account.
