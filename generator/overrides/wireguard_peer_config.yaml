type: telnyx_wireguard_peer_config
kind: ephemeral
description: The WireGuard configuration template of a peer, never stored in plan or state.
open: "GET /wireguard_peers/{id}/config"
path_params:
  id: wireguard_peer_id
attributes:
  value: {name: config, description: "The peer's WireGuard configuration file, with placeholders for values Telnyx does not store, such as the private key."}
