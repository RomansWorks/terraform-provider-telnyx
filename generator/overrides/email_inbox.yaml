type: telnyx_email_inbox
description: >-
  An inbox that receives email on an inbound-enabled domain, or on the account's shared
  inbound subdomain when `domain_id` is not set. The Telnyx API soft-deletes inboxes:
  after destroy the address stays reserved.
create: POST /email_inboxes
read: GET /email_inboxes/{id}
delete: DELETE /email_inboxes/{id}
list: GET /email_inboxes
list_name: telnyx_email_inboxes
attributes:
  username:
    returned: true
    computed: true
    lowercase: true
    description: The local part of the address, before the `@`, in lowercase. Generated when not set.
