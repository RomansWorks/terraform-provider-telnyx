type: telnyx_10dlc_campaign
description: >-
  A 10DLC campaign: a registered use case under which a 10DLC brand sends A2P SMS from US
  10-digit long code numbers. Creating a campaign charges a non-refundable three months of its
  use case's cost; after creation only the sample messages, help message, message flow, webhooks,
  reseller and auto-renewal can change. Destroying a campaign deactivates it permanently.
create: POST /10dlc/campaignBuilder
read: GET /10dlc/campaign/{campaignId}
update: PUT /10dlc/campaign/{campaignId}
delete: DELETE /10dlc/campaign/{campaignId}
list: GET /10dlc/campaign
id: campaignId
attributes:
  webhookURL: {name: webhook_url}
  webhookFailoverURL: {name: webhook_failover_url}
  tag: {name: tags, set: true}
  mnoIds: {set: true}
  subUsecases: {set: true}
  autoRenewal:
    description: Renew the campaign automatically at the end of each billing period. A campaign that is not renewed expires.
