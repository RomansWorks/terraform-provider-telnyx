type: telnyx_agent_gateway_policy_attachment
description: Where an Agent Gateway applies a policy. It has no update, so every change replaces it.
create: "POST /agent_gateways/{instance_id}/policy_attachments"
delete: "DELETE /agent_gateways/{instance_id}/policy_attachments/{attachment_id}"
list: "GET /agent_gateways/{instance_id}/policy_attachments"
read_from: {op: "GET /agent_gateways/{instance_id}/policy_attachments", key: id}
path_params:
  instance_id: gateway_id
  attachment_id: id
attributes:
  models: {set: true}
