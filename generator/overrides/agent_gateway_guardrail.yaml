type: telnyx_agent_gateway_guardrail
description: A guardrail on an Agent Gateway, a check that requests and responses pass through.
create: "POST /agent_gateways/{instance_id}/guardrails"
update: "PATCH /agent_gateways/{instance_id}/guardrails/{guardrail_id}"
delete: "DELETE /agent_gateways/{instance_id}/guardrails/{guardrail_id}"
list: "GET /agent_gateways/{instance_id}/guardrails"
read_from: {op: "GET /agent_gateways/{instance_id}/guardrails", key: id}
path_params:
  instance_id: gateway_id
  guardrail_id: id
attributes:
  # Responses leave out the provider secrets in settings, so the settings
  # are sent but not read back.
  settings: {write_only: true}
  modes: {set: true}
