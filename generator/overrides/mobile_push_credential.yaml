type: telnyx_mobile_push_credential
description: Credentials for sending push notifications to iOS (APNs) or Android (FCM) apps that use the WebRTC SDKs.
create: POST /mobile_push_credentials
read: GET /mobile_push_credentials/{push_credential_id}
delete: DELETE /mobile_push_credentials/{push_credential_id}
list: GET /mobile_push_credentials
attributes:
  private_key: {sensitive: true}
  certificate: {sensitive: true}
  project_account_json_file: {sensitive: true}
