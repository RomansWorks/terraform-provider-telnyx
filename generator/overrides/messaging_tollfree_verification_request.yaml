type: telnyx_messaging_tollfree_verification_request
description: A toll-free verification request, which registers the business and use case behind toll-free numbers so carriers deliver their messages.
create: POST /messaging_tollfree/verification/requests
read: GET /messaging_tollfree/verification/requests/{id}
update: PATCH /messaging_tollfree/verification/requests/{id}
delete: DELETE /messaging_tollfree/verification/requests/{id}
list: GET /messaging_tollfree/verification/requests
attributes:
  id: {description: Identifies the verification request.}
  optInWorkflowImageURLs: {name: opt_in_workflow_image_urls}
  optInWorkflowImageURLs[].url: {description: A URL of an image showing the opt-in workflow.}
  privacyPolicyURL: {name: privacy_policy_url}
  termsAndConditionURL: {name: terms_and_condition_url}
  phoneNumbers: {set: true}
  phoneNumbers[].phoneNumber: {description: A toll-free number in +E.164 format.}
  campaignVerifyAuthorizationToken: {sensitive: true}
  reason: {description: The reason given for the current verification status.}
