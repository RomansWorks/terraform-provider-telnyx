type: telnyx_ai_assistant_tag
description: One tag on an AI assistant. Do not also set `tags` on the same `telnyx_ai_assistant`, or the two will undo each other's changes.
create: POST /ai/assistants/{assistant_id}/tags
delete: DELETE /ai/assistants/{assistant_id}/tags/{tag}
read_from: {op: "GET /ai/assistants/{assistant_id}", field: tags}
id: tag
attributes:
  tag: {description: The tag.}
