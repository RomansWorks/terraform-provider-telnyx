type: telnyx_mobile_phone_number
description: A mobile phone number in your account, with its voice settings (call forwarding, recording, CNAM, interception apps). Create adopts a number you already own. The API cannot delete mobile numbers, so destroy only removes the number from Terraform state.
create: PATCH /mobile_phone_numbers/{id}
read: GET /mobile_phone_numbers/{id}
update: PATCH /mobile_phone_numbers/{id}
list: GET /mobile_phone_numbers
id_from_path: id
path_params:
  id: mobile_phone_number_id
delete_warning: The Telnyx API cannot delete mobile phone numbers. The number was removed from Terraform state but is still in your Telnyx account with its current settings.
attributes:
  id: {description: Identifies the mobile phone number.}
  tags: {set: true}
  call_forwarding: {description: Call forwarding settings of the number.}
  call_forwarding.call_forwarding_enabled: {description: Whether calls to the number are forwarded.}
  call_forwarding.forwarding_type: {description: "When calls are forwarded: `always`, or `on-failure` when the call cannot be connected."}
  call_forwarding.forwards_to: {description: The +E.164 number calls are forwarded to.}
  call_recording: {description: Recording settings for inbound calls.}
  call_recording.inbound_call_recording_enabled: {description: Whether inbound calls are recorded.}
  call_recording.inbound_call_recording_channels: {description: Whether recordings have one channel or a separate channel per party.}
  call_recording.inbound_call_recording_format: {description: The audio format of recordings.}
  cnam_listing: {description: Caller ID name (CNAM) listing settings.}
  cnam_listing.cnam_listing_enabled: {description: Whether a CNAM listing is published for the number.}
  cnam_listing.cnam_listing_details: {description: The caller ID name to list.}
  inbound: {description: Settings for inbound calls.}
  outbound: {description: Settings for outbound calls.}
