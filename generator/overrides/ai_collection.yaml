type: telnyx_ai_collection
description: A knowledge collection that AI assistants search, filled from storage buckets, calls, meetings and messages.
create: POST /ai/collections
read: GET /ai/collections/{uuid}
update: PATCH /ai/collections/{uuid}
delete: DELETE /ai/collections/{uuid}
list: GET /ai/collections
id: uuid
# Retrieval settings change through their own endpoint, also straight
# after create. The read hook copies settings.retrieval to retrieval.
updates:
  - op: PATCH /ai/collections/{uuid}/settings
attributes:
  settings: {skip: true}
  retrieval: {returned: true}
  # Sources are managed one by one with telnyx_ai_collection_source, which
  # can also remove them; the collection only reports them.
  sources: {computed: true}
