type: telnyx_integration_secret
description: A secret that AI assistant tools send to your services, as a bearer token or a username and password. The API never returns the secret's value.
create: POST /integration_secrets
delete: DELETE /integration_secrets/{id}
list: GET /integration_secrets
read_from: {op: "GET /integration_secrets", key: id}
attributes:
  token: {sensitive: true}
  password: {sensitive: true}
