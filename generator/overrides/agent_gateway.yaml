type: telnyx_agent_gateway
description: An Agent Gateway, an LLM and tool gateway that runs as a peer on one of the account's WireGuard Interfaces. It has no update, so every change replaces it; create waits until it is ready.
create: POST /agent_gateways
read: "GET /agent_gateways/{instance_id}"
delete: "DELETE /agent_gateways/{instance_id}"
list: GET /agent_gateways
path_params:
  instance_id: id
timeouts: true
