type: telnyx_porting_order
description: An order to port phone numbers into Telnyx from another carrier.
create: POST /porting_orders
read: GET /porting_orders/{id}
update: PATCH /porting_orders/{id}
delete: DELETE /porting_orders/{id}
list: GET /porting_orders
attributes:
  phone_number_configuration.tags: {set: true}
  # A hook turns the returned number objects into strings.
  phone_numbers: {set: true, returned: true}
  end_user.admin.pin_passcode: {sensitive: true}
