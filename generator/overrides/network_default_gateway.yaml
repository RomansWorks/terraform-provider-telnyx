type: telnyx_network_default_gateway
description: "The default gateway of a network: the WireGuard peer that traffic without a more specific route leaves through. There is one per network, identified by the network id."
create: POST /networks/{id}/default_gateway
read_from: {op: "GET /networks/{id}/default_gateway", key: network_id}
delete: DELETE /networks/{id}/default_gateway
id_from_path: id
path_params:
  id: network_id
