type: telnyx_enterprise_reputation_number
description: "A phone number under reputation monitoring for an enterprise, with its ownership status and latest reputation data."
create: POST /enterprises/{enterprise_id}/reputation/numbers
read: GET /enterprises/{enterprise_id}/reputation/numbers/{phone_number}
delete: DELETE /enterprises/{enterprise_id}/reputation/numbers/{phone_number}
list: GET /enterprises/{enterprise_id}/reputation/numbers
id: phone_number
attributes:
  phone_numbers: {skip: true} # the create hook sends phone_number as a list of one
  phone_number: {required: true, description: "The phone number to monitor, in E.164 format with a leading `+`."}
