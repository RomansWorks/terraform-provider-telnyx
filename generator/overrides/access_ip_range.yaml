type: telnyx_access_ip_range
description: A CIDR block allowed to reach the Telnyx API and portal for your account. Read from the list of ranges, because the API has no single-range read.
create: POST /access_ip_ranges
read_from: {op: GET /access_ip_ranges, key: id}
delete: DELETE /access_ip_ranges/{access_ip_range_id}
list: GET /access_ip_ranges
