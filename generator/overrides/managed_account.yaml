type: telnyx_managed_account
description: "A managed account: a separate Telnyx account that this manager account creates and administers. The API cannot delete managed accounts: destroy removes it from Terraform state, and the telnyx_managed_account_disable action disables it."
create: POST /managed_accounts
read: GET /managed_accounts/{id}
update: PATCH /managed_accounts/{id}
list: GET /managed_accounts
updates:
  - op: PATCH /managed_accounts/{id}/update_global_channel_limit
attributes:
  api_key: {sensitive: true}
  api_token: {sensitive: true}
  password: {sensitive: true}
