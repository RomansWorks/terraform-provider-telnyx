type: telnyx_sim_card
description: A SIM card in your account. Create adopts a SIM card you already registered or purchased and manages its settings. Destroy keeps the SIM card unless release_on_destroy is true, which decommissions it.
create: PATCH /sim_cards/{id}
read: GET /sim_cards/{id}
update: PATCH /sim_cards/{id}
delete: DELETE /sim_cards/{id}
list: GET /sim_cards
id_from_path: id
path_params:
  id: sim_card_id
release_on_destroy: true
attributes:
  tags: {set: true}
  authorized_imeis: {set: true}
  pin_puk_codes: {sensitive: true}
