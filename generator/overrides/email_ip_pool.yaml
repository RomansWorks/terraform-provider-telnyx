type: telnyx_email_ip_pool
description: >-
  A pool of dedicated IPs that carries the mail of one email domain (`domain_id`) or, as the
  account default (`is_default`), of every domain without a pool of its own.
create: POST /email/ip_pools
read: GET /email/ip_pools/{id}
update: PATCH /email/ip_pools/{id}
delete: DELETE /email/ip_pools/{id}
list: GET /email/ip_pools
force_destroy: [force, drain]
