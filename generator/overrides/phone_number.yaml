type: telnyx_phone_number
description: A phone number in your account. Create adopts a number you already own and manages its settings. Destroy keeps the number unless release_on_destroy is true.
create: PATCH /phone_numbers/{id}
read: GET /phone_numbers/{id}
update: PATCH /phone_numbers/{id}
delete: DELETE /phone_numbers/{id}
list: GET /phone_numbers
id_from_path: id
path_params:
  id: phone_number_id
release_on_destroy: true
attributes:
  tags: {set: true}
  external_pin: {sensitive: true}
