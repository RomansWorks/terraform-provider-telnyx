type: telnyx_ai_conversation_insight_group_assignment
description: The assignment of an insight template to an insight group.
create: POST /ai/conversations/insight-groups/{group_id}/insights/{insight_id}/assign
delete: DELETE /ai/conversations/insight-groups/{group_id}/insights/{insight_id}/unassign
read_from: {op: "GET /ai/conversations/insight-groups/{group_id}", field: insights, key: id}
id_from_path: insight_id
attributes:
  # The group lists the insight templates themselves; their settings belong
  # to telnyx_ai_conversation_insight.
  id: {skip: true}
  created_at: {skip: true}
  insight_type: {skip: true}
  instructions: {skip: true}
  json_schema: {skip: true}
  name: {skip: true}
  webhook: {skip: true}
