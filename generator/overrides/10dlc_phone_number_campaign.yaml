type: telnyx_10dlc_phone_number_campaign
description: >-
  The assignment of a phone number to a 10DLC campaign, which decides the registered campaign its
  A2P SMS traffic is sent under. Destroying it removes the number from the campaign.
create: POST /10dlc/phone_number_campaigns
read: GET /10dlc/phone_number_campaigns/{phoneNumber}
update: PUT /10dlc/phone_number_campaigns/{phoneNumber}
delete: DELETE /10dlc/phone_number_campaigns/{phoneNumber}
list: GET /10dlc/phone_number_campaigns
id: phoneNumber
attributes:
  phoneNumber:
    description: The phone number in E.164 format.
