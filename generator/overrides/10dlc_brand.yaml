type: telnyx_10dlc_brand
description: >-
  A 10DLC brand: the company or person registered with The Campaign Registry (TCR) to send
  A2P SMS from US 10-digit long code numbers. Each brand registration has an up-front,
  non-refundable fee, and a brand cannot be deleted while it has active campaigns or campaigns
  deactivated less than three months ago.
create: POST /10dlc/brand
read: GET /10dlc/brand/{brandId}
update: PUT /10dlc/brand/{brandId}
delete: DELETE /10dlc/brand/{brandId}
list: GET /10dlc/brand
id: brandId
attributes:
  webhookURL: {name: webhook_url}
  webhookFailoverURL: {name: webhook_failover_url}
  mock:
    description: Create a mock brand for testing. Mock brands are not sent to the registry and cannot be changed into real brands.
  mobilePhone:
    description: Mobile phone number of a sole proprietor brand in E.164 format. It receives the SMS one-time password that verifies the brand.
